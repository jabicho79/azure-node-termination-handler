# kind cluster for the e2e suite (cluster name: anth-e2e).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # The tests reach the fake IMDS through the fake-imds NodePort Service.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        listenAddress: 127.0.0.1
        protocol: TCP
  - role: worker
  - role: worker
